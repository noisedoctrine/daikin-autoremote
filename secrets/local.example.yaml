version: 1

ssh:
  user: "pi-user"
  host: "192.0.2.68"
  identity_file: "~/.ssh/daikin_project"

network:
  port_scan_target: "192.0.2.50"
  legacy_discovery_subnet: "192.0.2.0/24"
  discovery_targets:
    - "192.0.2.50"
    - "192.0.2.57"
    - "192.0.2.59"

pigpio:
